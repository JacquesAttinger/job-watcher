[project]
name = "job-watcher"
version = "0.1.0"
description = "Hourly internship-posting watcher run by a Claude cloud routine, alerting via ntfy."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "pre-commit>=3"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "BLE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
